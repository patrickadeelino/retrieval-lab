[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "retrieval-lab"
version = "0.1.0"
description = "A reproducible retrieval strategy lab over a frozen Portuguese corpus"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.54.0",
  "qdrant-client==1.19.1",
  "fastembed==0.8.1",
  "typing-extensions>=4.8",
  "transformers==4.57.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=7,<8",
  "httpx2>=2,<3",
  "ruff>=0.13,<1",
  "mypy>=1.18,<2",
  "beautifulsoup4>=4.12,<5",
  "types-beautifulsoup4>=4.12,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/hybrid_retrieval_lab/evaluation/report.py" = ["E501"]  # Embedded HTML literals preserve the published report.

[tool.mypy]
python_version = "3.11"
files = ["src/hybrid_retrieval_lab", "scripts"]
strict = true

[tool.coverage.run]
branch = true
source = ["src/hybrid_retrieval_lab", "scripts"]
relative_files = true

[tool.coverage.report]
precision = 2
show_missing = true
