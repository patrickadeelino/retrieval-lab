services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: .
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: github_docs_pilot_active
      QDRANT_LEGACY_COLLECTION: github_docs_pilot
      FASTEMBED_CACHE_PATH: /models
      LOG_FILE: /app/logs/hybrid-retrieval-lab.log
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_MAX_BYTES: ${LOG_MAX_BYTES:-10485760}
      LOG_BACKUP_COUNT: ${LOG_BACKUP_COUNT:-5}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - model_cache:/models
      - ./data/qrels:/app/data/qrels:ro
      - ./data/queries:/app/data/queries:ro
      - ./reports:/app/reports
      - ./logs:/app/logs
    depends_on:
      - qdrant

volumes:
  qdrant_data:
  model_cache:
