name: Code quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-and-static-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.11.3
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install project and development tools
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run --locked ruff check src scripts tests

      - name: Check formatting
        run: uv run --locked ruff format --check src scripts tests

      - name: Check types
        run: uv run --locked mypy

      - name: Run unit tests with coverage
        run: >-
          uv run --locked pytest -q -m unit tests/unit --cov
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-report=json:coverage.json
          --cov-report=html:htmlcov
          --cov-report=markdown-append:"$GITHUB_STEP_SUMMARY"

      - name: Save unit coverage reports
        if: ${{ !cancelled() && hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-coverage
          path: |
            coverage.xml
            coverage.json
            htmlcov/
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: coverage.xml
          flags: unit
          name: unit-tests
          disable_search: true
          fail_ci_if_error: true
